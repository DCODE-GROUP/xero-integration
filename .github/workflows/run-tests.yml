name: run-tests

on:
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    uses: ./.github/workflows/static-analysis.yml
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-analysis]
    strategy:
      fail-fast: true
      matrix:
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*, 11.*, 10.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Pest 2 (required by Testbench 8) is not compatible with PHP 8.5
          - laravel: 10.*
            php: 8.5
        include:
          - laravel: 10.*
            testbench: 8.*
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer config policy.advisories.ignore-id --json --merge '["PKSA-b41t-wbzk-9q51","PKSA-d5tc-s1qs-h781","PKSA-3r5d-mb8f-1qw9","PKSA-m5cs-t1y6-qpcs","PKSA-mdq4-51ck-6kdq","PKSA-8qx3-n5y5-vvnd","PKSA-w7xr-vk7n-rstm","PKSA-q46n-4fdk-zjr4","PKSA-qzrn-rnz3-85w1"]'
          if [ "${{ matrix.laravel }}" = "10.*" ]; then
            # These dev tools require Laravel 11+ and are not needed to run the tests.
            composer remove --dev larastan/larastan laravel/boost phpstan/extension-installer phpstan/phpstan-deprecation-rules phpstan/phpstan-phpunit --no-interaction --no-update
          fi
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Setup environment
        run: cp workbench/.env.example workbench/.env

      - name: Execute tests
        run: vendor/bin/pest --ci --parallel --stop-on-failure
